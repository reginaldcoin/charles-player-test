app = "charles-player-test"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

# The clip renderer shares this box with the player: a 1080p encode
# is a ~400 MB job at its peak, and two may run at once beside the
# server itself. The 256 MB default starved the encoder to death
# (SIGKILL, seconds in) while leaving the player untouched.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "player_data"
  destination = "/app/data"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
